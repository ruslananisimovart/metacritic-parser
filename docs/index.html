<title>Skytec · парсер Metacritic</title>
<script>
  // тема ставится до первой отрисовки, иначе при тёмной теме страница мигает светлой;
  // пока пользователь не выбрал тему сам, берём системную
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("skytec-parser-theme"); } catch (e) {}
    var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-omtheme", saved === "dark" || saved === "light" ? saved : system);
  })();
</script>
